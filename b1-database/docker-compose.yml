# PostgreSQL 17 pour le module B1. Lance : docker compose --env-file .env up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "${PGPORT}:5432"
    volumes:
      - matrice-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 2s
      retries: 15

volumes:
  matrice-pgdata:
